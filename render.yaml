services:
  - type: web
    name: manufacturing-erp-demo
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: sqlite
      - key: AUTO_SEED
        value: "true"
      - key: JWT_SECRET
        generateValue: true

